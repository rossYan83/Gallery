<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixabay Gallery - Editor's Choice</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Editor's Choice Images</h1>
        </header>

        <div class="api-key-section">
            <input type="text" id="apiKeyInput" placeholder="Enter your Pixabay API key">
            <button id="saveKeyBtn">Save API Key</button>
        </div>

        <div class="error" id="error"></div>
        <div class="loading" id="loading">Loading images...</div>
        
        <div class="gallery" id="gallery"></div>

        <div class="load-more-container">
            <button class="load-more" id="loadMore">
                View More
            </button>
        </div>
    </div>

    <!-- Load scripts in correct order -->
    <script src="api.js"></script>
    <script src="storage.js"></script>
    <script src="gallery.js"></script>
    <script src="app.js"></script>
</body>
</html>
